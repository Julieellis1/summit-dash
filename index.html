<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2cfaa" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <title>Summit Dash — Phase 0 Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl" tabindex="0" aria-label="Summit Dash mountain"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div class="brand glass">
        <div class="logo">⛰️</div>
        <div><b>SUMMIT DASH</b><small id="dayLabel">Day 1 / 12</small></div>
      </div>
      <div class="pot glass" id="pot" title="Storm Pot — erupts when full">
        <div class="pot-head"><span>⛈️ Storm Pot</span><b id="potNum">0 / 16</b></div>
        <div class="pot-bar"><i id="potFill"></i></div>
      </div>
      <div class="spacer"></div>
      <div class="top-actions glass" style="padding:4px;border-radius:16px">
        <button class="icon-btn" id="btnOverview" title="Mountain overview" aria-label="Overview">🗺️</button>
        <button class="icon-btn only-mobile" id="btnPanel" title="Squad & feed" aria-label="Squad and feed">👥</button>
        <button class="icon-btn desk" id="btnFair" title="Fairness" aria-label="Fairness">⚖️</button>
        <button class="icon-btn" id="btnMute" title="Sound" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </header>
    <div id="sprintBanner" class="banner hidden"></div>

    <aside id="side" class="glass side" aria-label="Squad panel">
      <button class="grab" id="grab" aria-label="Close panel">Close</button>
      <nav class="tabs" id="tabs">
        <button data-tab="squad" class="on">🏔️ Squad</button>
        <button data-tab="feed">📣 Feed</button>
        <button data-tab="fair">⚖️ Fairness</button>
        <button data-tab="rules">📖 Rules</button>
      </nav>
      <div class="pane" id="pane-squad"></div>
      <div class="pane hidden" id="pane-feed"></div>
      <div class="pane hidden" id="pane-fair"></div>
      <div class="pane hidden" id="pane-rules"></div>
    </aside>

    <div class="status glass" id="status"></div>

    <footer class="dock">
      <div class="hand glass" id="hand"></div>
      <div class="roll-wrap">
        <div id="throwPips" class="glass"></div>
        <button id="rollBtn" class="roll"><span class="armed" id="armed"></span>ROLL<span class="cnt" id="rollCnt">0</span></button>
        <small id="rollSub"></small>
      </div>
      <button id="endDayBtn" class="endday glass">End Day ▸</button>
    </footer>
    <div id="toasts" aria-live="polite"></div>
  </div>

  <div id="modal-root"></div>
  <div id="eruption" class="hidden"></div>
  <div id="loading"><div><div class="m">⛰️</div><div>SUMMIT DASH</div></div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
